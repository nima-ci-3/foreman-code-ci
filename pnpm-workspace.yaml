packages:
  - apps/*
  - packages/*

autoInstallPeers: false
sharedWorkspaceLockfile: true
# Native qualification pins inode metadata; another install must not change it.
packageImportMethod: clone-or-copy
minimumReleaseAge: 2880
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

# Transitive hono (via the Claude Agent SDK's MCP SDK) gets the patched release.
overrides:
  'hono@<4.12.25': 4.13.13

allowBuilds:
  esbuild: true
  msgpackr-extract: false
  msw: false

patchedDependencies:
  '@langchain/langgraph@1.4.15': patches/@langchain__langgraph@1.4.15.patch
