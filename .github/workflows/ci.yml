name: CI
# Main dispatches one run per CI suite or integration partition on the public mirror, where runners are free.
run-name: ci ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Main's CI run id
        required: true
      ref:
        description: The published snapshot commit to test
        required: true
      suite:
        description: install, typecheck, lint, unit, build, integration or a check part (scripts/ci-suite.sh)
        required: true
      slice:
        description: Unit shard i/n or integration file indexes (scripts/ci-files.mjs); empty runs them all
        required: false
        default: ''
      scope:
        description: full or affected
        required: false
        default: affected
      files:
        description: Selected repository file indexes for affected unit, lint or typecheck
        required: false
        default: ''
      default_branch:
        description: Workspace default branch comparison ref on the mirror
        required: false
        default: main
      base_commit:
        description: Optional sanitized ancestor SHA for affected selection on the mirror
        required: false
        default: ''
      partition:
        description: Runner-selected partition as JSON
        required: false
        default: ''
      expected_duration_ms:
        description: Expected duration of this CI part in milliseconds
        required: false
        default: '0'
      gate:
        description: Gate identity for integration execution
        required: false
        default: '0'
      durations:
        description: Learned file durations shared by every partition as JSON
        required: false
        default: '{}'

permissions:
  # contents: write publishes each typecheck and lint part's state as a ci-state release asset (see below).
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      # ubuntu-latest is a full systemd VM; the suite probes a delegated user service before integration.
      CI_USER_SYSTEMD: '1'
      FOREMAN_CODE_CI_DEDICATED: '1'
      FOREMAN_CODE_CI_CONTRACTS_CACHE: .logs/ci-contracts-cache
      FOREMAN_CODE_CI_CLIS_PREFIX: .logs/ci-clis
      SUITE: ${{ inputs.suite }}
      SLICE: ${{ inputs.slice }}
      SCOPE: ${{ inputs.scope }}
      SELECTED_FILES: ${{ inputs.files }}
      DEFAULT_BRANCH: ${{ inputs.default_branch }}
      BASE_COMMIT: ${{ inputs.base_commit }}
      CI_PARTITION: ${{ inputs.partition }}
      CI_EXPECTED_DURATION_MS: ${{ inputs.expected_duration_ms }}
      FOREMAN_CODE_CI_GATE: ${{ inputs.gate }}
      CI_DURATIONS: ${{ inputs.durations }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.base_commit != '' && 2 || 1 }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      # The pinned pnpm through corepack, as on our computers; Worker tests read it offline from corepack's cache.
      - run: corepack enable && corepack install
      # Chromium's sandbox needs unprivileged user namespaces, which the image's AppArmor policy restricts.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - id: cache-inputs
        run: |
          echo "packages=$(node scripts/ci-packages.mjs key "$PWD")" >> "$GITHUB_OUTPUT"
          if [ "$SUITE" != install ]; then
            echo "contracts=$(node scripts/ci-contracts.mjs key "$PWD")" >> "$GITHUB_OUTPUT"
          fi
          # The CLIs install with the 48-hour package age rule; a weekly key refreshes them.
          echo "clis=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # Harness CLIs installed by the suite's start step; restored before it so a hit skips the install.
      - if: contains(fromJSON('["unit","unit-api","integration"]'), inputs.suite)
        uses: actions/cache/restore@v4
        with:
          path: .logs/ci-clis
          key: clis-v1-${{ runner.os }}-${{ runner.arch }}-node24.22.1-${{ steps.cache-inputs.outputs.clis }}
      - run: scripts/ci-suite.sh start
      # Installed packages and the pnpm store have separate archives.
      - id: packages
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            !node_modules/.pnpm-store
            !node_modules/.vitest-cache
            !**/node_modules/.cache
            !apps/web/node_modules/.tmp
          key: packages-v2-${{ runner.os }}-${{ steps.cache-inputs.outputs.packages }}
      # Native payload validation needs publication metadata even on installed-package hits.
      - id: metadata
        uses: actions/cache/restore@v4
        with:
          path: .logs/pnpm-metadata
          key: pnpm-metadata-v2-${{ runner.os }}-${{ steps.cache-inputs.outputs.packages }}
      # Restore native store content alongside package hits so validation and repair can stay offline.
      - id: store
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.pnpm-store
          key: pnpm-store-v2-${{ runner.os }}-${{ steps.cache-inputs.outputs.packages }}
      - name: Install from cached store
        run: node scripts/ci-packages.mjs install "$PWD"
        env:
          CI_PNPM_STORE_CACHE_HIT: ${{ steps.store.outputs.cache-hit }}
      # Emitting compilers restore output and build info together, only for identical inputs so deleted source
      # cannot leave stale compiled modules. Keeping build info in dist also invalidates it on a local cleanup.
      - name: Contracts build cache
        if: inputs.suite != 'install'
        uses: actions/cache/restore@v4
        with:
          path: packages/contracts/dist
          key: contracts-build-${{ runner.os }}-${{ steps.cache-inputs.outputs.contracts }}
      - name: API build cache
        id: api-build
        if: inputs.suite == 'build' || inputs.suite == 'build-api'
        uses: actions/cache/restore@v4
        with:
          path: apps/api/dist
          key: api-build-${{ runner.os }}-node24.22.1-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/api/src/**', '!apps/api/src/**/*.test.ts', '!apps/api/src/**/__tests__/**', 'apps/api/tsconfig*.json', 'apps/api/package.json', 'apps/ci/src/**', 'apps/ci/tsconfig*.json', 'apps/ci/package.json', 'packages/contracts/src/**', '!packages/contracts/src/**/*.test.ts', '!packages/contracts/src/**/*.spec.ts', 'packages/contracts/tsconfig*.json', 'packages/contracts/package.json', 'scripts/copy-api-runtime.mjs') }}
      # Main's TypeScript and ESLint state (saved by the default-branch cache warmer): checks re-run only what changed.
      - name: Typecheck and lint state from main
        if: startsWith(inputs.suite, 'typecheck') || startsWith(inputs.suite, 'lint')
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/*/node_modules/.cache/tsc
            apps/*/node_modules/.cache/eslint
            packages/*/node_modules/.cache/tsc
            packages/*/node_modules/.cache/eslint
          key: suite-state-v2-${{ runner.os }}-node24.22.1-${{ steps.cache-inputs.outputs.packages }}-${{ inputs.ref }}
          # Another package set's state is safe to start from: TypeScript compares every input file's content and
          # lint keys carry each imported package's locked tree, so only what a dependency change reaches re-checks.
          restore-keys: |
            suite-state-v2-${{ runner.os }}-node24.22.1-${{ steps.cache-inputs.outputs.packages }}-
            suite-state-v2-${{ runner.os }}-node24.22.1-
      # Snapshot refs can read only main's cache, so a branch's runs never saw each other's state and re-checked
      # everything that differs from main. Each part's newest state is a release asset (any ref, any provider); its
      # contents are keyed by file content, so a newer state from another commit is safe to start from; each state file
      # keeps its freshest copy (cp -u) between it and main's state.
      - name: Typecheck and lint state from the newest run
        if: startsWith(inputs.suite, 'typecheck') || startsWith(inputs.suite, 'lint')
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: run-state-${{ inputs.suite }}-${{ steps.cache-inputs.outputs.packages }}.tar.gz
        run: |
          if gh release download ci-state -R "$GITHUB_REPOSITORY" -p "$ASSET" -D "$RUNNER_TEMP" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/run-state" && tar -xzf "$RUNNER_TEMP/$ASSET" -C "$RUNNER_TEMP/run-state" \
              && cp -a -u "$RUNNER_TEMP/run-state/." . && echo "Restored the newest run's state ($ASSET)."
          else
            echo "No newer run state for $ASSET; starting from main's state."
          fi
          node -e 'import("./scripts/ci-suite-state.mjs").then(state => state.recordSuiteState(process.cwd()))'
      # Both suites check the same no-emit web projects; share semantic results instead of checking them twice.
      - name: Web TypeScript cache
        id: web-typecheck
        if: (startsWith(inputs.suite, 'typecheck') || startsWith(inputs.suite, 'build')) && inputs.suite != 'typecheck-api' && inputs.suite != 'build-api'
        uses: actions/cache/restore@v4
        with:
          path: apps/web/node_modules/.cache/tsc
          key: web-typecheck-${{ runner.os }}-node24.22.1-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/*.ts', 'apps/web/tsconfig*.json', 'apps/web/package.json', 'packages/contracts/src/**', 'packages/contracts/tsconfig*.json') }}
          restore-keys: |
            web-typecheck-${{ runner.os }}-node24.22.1-${{ hashFiles('pnpm-lock.yaml') }}-
            web-typecheck-${{ runner.os }}-node24.22.1-
      # Suite state is private to each immutable ci-snapshot ref. Do not upload rolling
      # archives here: later snapshots cannot restore them, and they evict shared package caches.
      - name: Suite
        # The output is also kept as an artifact, so Main settles the result without downloading the provider log.
        shell: bash
        run: scripts/ci-suite.sh 2>&1 | tee "${{ runner.temp }}/suite.log"
        env:
          DURATIONS_OUTPUT: ${{ runner.temp }}/durations.json
          TEST_RESULTS_OUTPUT: ${{ runner.temp }}/test-results.json
          CI_SELECTION_OUTPUT: ${{ runner.temp }}/selection.json
          CI_WATCHDOG_MESSAGE_FILE: ${{ runner.temp }}/watchdog-message.json
      - name: Publish this run's typecheck and lint state
        if: always() && (startsWith(inputs.suite, 'typecheck') || startsWith(inputs.suite, 'lint'))
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: run-state-${{ inputs.suite }}-${{ steps.cache-inputs.outputs.packages }}.tar.gz
        run: |
          set -euo pipefail
          changed=$(node -e 'import("./scripts/ci-suite-state.mjs").then(state => console.log(state.suiteStateChanged(process.cwd())))')
          [ "$changed" = true ] || { echo 'State unchanged; nothing to publish.'; exit 0; }
          paths=$(ls -d apps/*/node_modules/.cache/tsc apps/*/node_modules/.cache/eslint \
            packages/*/node_modules/.cache/tsc packages/*/node_modules/.cache/eslint 2>/dev/null || true)
          [ -n "$paths" ] || exit 0
          tar -czf "$RUNNER_TEMP/$ASSET" $paths
          gh release view ci-state -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create ci-state -R "$GITHUB_REPOSITORY" \
            --title 'CI state' --notes 'Typecheck and lint state for CI jobs.' --latest=false || true
          gh release upload ci-state -R "$GITHUB_REPOSITORY" "$RUNNER_TEMP/$ASSET" --clobber
      # Measured durations and structured test results, which Main reads back with the ticket.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations
          path: |
            ${{ runner.temp }}/durations.json
            ${{ runner.temp }}/durations.json.vitest.json
            ${{ runner.temp }}/test-results.json
            ${{ runner.temp }}/integration-coverage.json
            ${{ runner.temp }}/selection.json
            ${{ runner.temp }}/watchdog-message.json
            ${{ runner.temp }}/suite.log
          retention-days: 1
          if-no-files-found: ignore
      # Each failing integration file's full test log, for diagnosis without rerunning it.
      - if: failure() && inputs.suite == 'integration'
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: .logs/test-integration/
          retention-days: 2
          if-no-files-found: ignore
      - name: Save API build cache
        if: success() && steps.api-build.outputs.cache-hit != 'true' && steps.api-build.conclusion == 'success'
        uses: actions/cache/save@v4
        with:
          path: apps/api/dist
          key: ${{ steps.api-build.outputs.cache-primary-key }}
      - name: Save Web TypeScript cache
        if: success() && steps.web-typecheck.outputs.cache-hit != 'true' && steps.web-typecheck.conclusion == 'success'
        uses: actions/cache/save@v4
        with:
          path: apps/web/node_modules/.cache/tsc
          key: ${{ steps.web-typecheck.outputs.cache-primary-key }}
