name: Warm CI caches

on:
  push:
    branches: [main]

permissions:
  # contents: write publishes main's typecheck and lint state as a mirror release asset for CircleCI.
  contents: write
  actions: write

jobs:
  # GitHub makes default-branch caches available to every immutable snapshot ref. This job has no check result
  # to delay, and cache@v4 saves only on a key miss. Main publication starts it independently of suite dispatch.
  warm-caches:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: ci-warm-caches
    env:
      FOREMAN_CODE_CI_DEDICATED: '1'
      FOREMAN_CODE_CI_CONTRACTS_CACHE: .logs/ci-contracts-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: corepack enable && corepack install
      - id: cache-inputs
        run: |
          echo "packages=$(node scripts/ci-packages.mjs key "$PWD")" >> "$GITHUB_OUTPUT"
          echo "contracts=$(node scripts/ci-contracts.mjs key "$PWD")" >> "$GITHUB_OUTPUT"
          echo "clis=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .logs/ci-clis
          key: clis-v1-${{ runner.os }}-${{ runner.arch }}-node24.22.1-${{ steps.cache-inputs.outputs.clis }}
      - name: Warm harness CLIs
        run: |
          if [ ! -x .logs/ci-clis/bin/codex ] || [ ! -x .logs/ci-clis/bin/claude ]; then
            npm install --global --prefix "$PWD/.logs/ci-clis" --silent \
              --before="$(date -u -d '-2 days' +%Y-%m-%dT%H:%M:%SZ)" @openai/codex @anthropic-ai/claude-code
          fi
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            !node_modules/.pnpm-store
            !node_modules/.vitest-cache
            !**/node_modules/.cache
            !apps/web/node_modules/.tmp
          key: packages-v2-${{ runner.os }}-${{ steps.cache-inputs.outputs.packages }}
      - uses: actions/cache@v4
        with:
          path: .logs/pnpm-metadata
          key: pnpm-metadata-v2-${{ runner.os }}-${{ steps.cache-inputs.outputs.packages }}
      - id: store
        uses: actions/cache@v4
        with:
          path: node_modules/.pnpm-store
          key: pnpm-store-v2-${{ runner.os }}-${{ steps.cache-inputs.outputs.packages }}
      - name: Install from cached store
        run: node scripts/ci-packages.mjs install "$PWD"
        env:
          CI_PNPM_STORE_CACHE_HIT: ${{ steps.store.outputs.cache-hit }}
      - uses: actions/cache@v4
        with:
          path: packages/contracts/dist
          key: contracts-build-${{ runner.os }}-${{ steps.cache-inputs.outputs.contracts }}
      - run: corepack pnpm --filter @foreman-code/contracts build
      - run: corepack pnpm --filter @foreman-code/contracts-node build
      - name: Restore previous typecheck and lint state
        id: suite-state
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/*/node_modules/.cache/tsc
            apps/*/node_modules/.cache/eslint
            packages/*/node_modules/.cache/tsc
            packages/*/node_modules/.cache/eslint
          key: suite-state-v3-${{ runner.os }}-node24.22.1-${{ github.sha }}
          # Another package set's state is safe to start from: TypeScript compares every input file's content and
          # lint keys carry each imported package's locked tree, so only what a dependency change reaches re-checks.
          restore-keys: |
            suite-state-v3-${{ runner.os }}-node24.22.1-
      - name: Record restored suite state
        id: suite-state-before
        run: node scripts/ci-suite-state.mjs record
      # TypeScript build info and ESLint content caches for snapshot runs. Caches saved on the default branch are the
      # only ones every immutable ci-snapshot ref can restore, so snapshot typecheck and lint start from main's state
      # and re-check only what changed since. The checks' own result does not matter here.
      - name: Typecheck and lint state for snapshot runs
        # Every package runs to the end even when another fails, so each one's state is saved.
        continue-on-error: true
        run: |
          corepack pnpm --filter @foreman-code/ci build || true
          corepack pnpm -r --no-bail --no-sort --if-present typecheck || true
          corepack pnpm -r --no-bail --no-sort --if-present lint || true
      - name: Detect updated suite state
        id: suite-state-after
        if: always() && steps.suite-state-before.conclusion == 'success'
        run: |
          changed="$(node scripts/ci-suite-state.mjs changed)"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: always() && steps.suite-state.conclusion == 'success' && steps.suite-state.outputs.cache-hit != 'true' && steps.suite-state-after.outputs.changed == 'true'
        with:
          path: |
            apps/*/node_modules/.cache/tsc
            apps/*/node_modules/.cache/eslint
            packages/*/node_modules/.cache/tsc
            packages/*/node_modules/.cache/eslint
          key: ${{ steps.suite-state.outputs.cache-primary-key }}
      - name: Retain three suite state generations
        if: always() && steps.suite-state.conclusion == 'success'
        run: node scripts/ci-suite-state.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      # CircleCI cannot read GitHub's cache. The same state goes to a shared public release asset, so
      # CircleCI jobs also start from main's typecheck and lint state instead of their own last run (or nothing).
      - name: Publish typecheck and lint state for CircleCI
        if: always() && steps.suite-state.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="suite-state-node24.22.1.tar.gz"
          paths=$(ls -d apps/*/node_modules/.cache/tsc apps/*/node_modules/.cache/eslint \
            packages/*/node_modules/.cache/tsc packages/*/node_modules/.cache/eslint 2>/dev/null || true)
          [ -n "$paths" ] || { echo 'No typecheck or lint state to publish.'; exit 0; }
          tar -czf "$RUNNER_TEMP/$asset" $paths
          gh release view ci-state >/dev/null 2>&1 \
            || gh release create ci-state --title 'CI state' --notes 'Typecheck and lint state from main for CircleCI jobs.' --latest=false
          gh release upload ci-state "$RUNNER_TEMP/$asset" --clobber
